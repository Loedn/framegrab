[package]
name = "framegrab"
version = "0.3.0"
edition = "2021"

[lib]
name = "framegrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "framegrab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
serde_json = "1"
